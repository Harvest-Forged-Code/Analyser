[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-analyser"
version = "1.1.0"
description = "Budget Analyser - Personal finance tracking and analysis tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas~=2.3.3",
    "numpy~=2.2.3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest~=8.3.4",
    "pylint>=3.0",
    "httpx>=0.27.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/test"]
pythonpath = ["src"]

# Custom metadata for version management
# EngVer:1 = auto-increment patch on CI, EngVer:0 = developer mode (no auto-increment)
[tool.budget-analyser]
eng_ver = 1
