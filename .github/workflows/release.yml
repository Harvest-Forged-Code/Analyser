name: Build and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version-and-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Calculate Version from Tags
        id: version
        run: |
          uv run --no-project python << 'EOF'
          import tomllib
          import subprocess
          import os

          with open("pyproject.toml", "rb") as f:
              config = tomllib.load(f)

          eng_ver = config.get("tool", {}).get("budget-analyser", {}).get("eng_ver", 1)
          print(f"EngVer flag: {eng_ver}")

          if eng_ver != 1:
              print("EngVer is 0 (developer mode) - skipping release")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("version=0.0.0\n")
                  f.write("should_release=false\n")
              exit(0)

          # Read Major.Minor from pyproject.toml
          toml_version = config["project"]["version"]
          toml_parts = toml_version.split(".")
          major = int(toml_parts[0])
          minor = int(toml_parts[1]) if len(toml_parts) > 1 else 0
          print(f"pyproject.toml Major.Minor: {major}.{minor}")

          # Find latest tag in this Major.Minor series to determine patch
          try:
              result = subprocess.run(
                  ["git", "tag", "--list", f"v{major}.{minor}.*", "--sort=-version:refname"],
                  capture_output=True, text=True, check=True
              )
              matching_tags = [t.strip() for t in result.stdout.strip().splitlines() if t.strip()]
              if matching_tags:
                  latest_tag = matching_tags[0]
                  patch = int(latest_tag.split(".")[-1])
                  print(f"Latest tag for v{major}.{minor}.*: {latest_tag}")
              else:
                  latest_tag = f"v{major}.{minor}.0"
                  patch = 0
                  print(f"No tags found for v{major}.{minor}.*, starting patch from 0")
          except subprocess.CalledProcessError:
              latest_tag = f"v{major}.{minor}.0"
              patch = 0
              print(f"Error listing tags, starting patch from 0")

          new_patch = patch + 1
          new_version = f"{major}.{minor}.{new_patch}"
          print(f"New version: {new_version}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={new_version}\n")
              f.write("should_release=true\n")
              f.write(f"prev_tag={latest_tag}\n")
          EOF

      - name: Generate Changelog
        id: changelog
        if: steps.version.outputs.should_release == 'true'
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          VERSION="${{ steps.version.outputs.version }}"

          echo "Generating changelog from $PREV_TAG to HEAD"

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
            CHANGELOG="## What's Changed in v$VERSION"$'\n\n'
            if [ -n "$COMMITS" ]; then
              CHANGELOG+="$COMMITS"$'\n\n'
            else
              CHANGELOG+="- Minor updates and improvements"$'\n\n'
            fi
            CHANGELOG+="**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...v$VERSION"
          else
            CHANGELOG="## Initial Release v$VERSION"$'\n\n'"First release of Budget Analyser!"
          fi

          echo "$CHANGELOG" > changelog.md
          cat changelog.md

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat changelog.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create and Push Tag
        if: steps.version.outputs.should_release == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

  build-python:
    needs: version-and-tag
    if: needs.version-and-tag.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies (including pyinstaller)
        run: uv sync --group dev

      - name: Build sidecar binary
        run: uv run pyinstaller budget-analyser-api.spec --clean --distpath dist-sidecar

      - name: Stage binary with target triple name (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p src/frontend/src-tauri/binaries
          cp dist-sidecar/budget-analyser-api \
             src/frontend/src-tauri/binaries/budget-analyser-api-${{ matrix.triple }}
          chmod +x src/frontend/src-tauri/binaries/budget-analyser-api-${{ matrix.triple }}
        shell: bash

      - name: Stage binary with target triple name (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path src/frontend/src-tauri/binaries
          Copy-Item "dist-sidecar\budget-analyser-api.exe" `
            "src\frontend\src-tauri\binaries\budget-analyser-api-${{ matrix.triple }}.exe"
        shell: pwsh

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-sidecar-${{ matrix.triple }}
          path: src/frontend/src-tauri/binaries/
          if-no-files-found: error

  build-tauri:
    needs: [version-and-tag, build-python]
    if: needs.version-and-tag.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            triple: x86_64-pc-windows-msvc
          - os: macos-latest
            label: macOS_AppleSilicon
            triple: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src/frontend/src-tauri

      - name: Download sidecar binary
        uses: actions/download-artifact@v4
        with:
          name: release-sidecar-${{ matrix.triple }}
          path: src/frontend/src-tauri/binaries/

      - name: Make sidecar executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x src/frontend/src-tauri/binaries/budget-analyser-api-${{ matrix.triple }}

      - name: Update version in tauri.conf.json
        shell: bash
        run: |
          VERSION="${{ needs.version-and-tag.outputs.version }}"
          cd src/frontend/src-tauri
          python3 -c "
          import json
          with open('tauri.conf.json', 'r') as f:
              conf = json.load(f)
          conf['version'] = '$VERSION'
          with open('tauri.conf.json', 'w') as f:
              json.dump(conf, f, indent=2)
          "
          echo "Updated tauri.conf.json to version $VERSION"

      - name: Build Tauri app and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src/frontend
          tauriScript: npm run tauri
          tagName: v${{ needs.version-and-tag.outputs.version }}
          releaseName: Budget Analyser v${{ needs.version-and-tag.outputs.version }}
          releaseBody: |
            ${{ needs.version-and-tag.outputs.changelog }}

            ---

            ### Downloads
            - **Windows**: `.exe` installer
            - **macOS (Apple Silicon)**: `.dmg` for M1/M2/M3/M4 Macs

            > **No Python required** — fully self-contained installer.

            > **macOS Gatekeeper**: On first launch, right-click the app → "Open" → "Open".
