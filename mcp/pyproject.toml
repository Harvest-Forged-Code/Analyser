[project]
name = "budget-analyser-mcp"
version = "0.1.0"
description = "MCP server for Budget Analyser SQLite databases"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["budget_analyser_mcp"]
